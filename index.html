<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEIKEI OPEN 練習コート予約 (1〜5番)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #poster-print-area, #poster-print-area * { visibility: visible; }
      #poster-print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .sheet-table th, .sheet-table td {
      border: 1px solid #71717a;
    }
    .sheet-table {
      border: 2px solid #27272a;
    }
    /* スマホで横スクロール時に時間列を固定する */
    .sticky-time {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: #f3f4f6; /* gray-100 */
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col items-center py-4">

  <!-- メインコンテナ -->
  <main class="w-full max-w-5xl bg-white shadow-md border border-gray-300 p-2 sm:p-4">
    
    <!-- ヘッダー -->
    <div class="flex flex-col md:flex-row justify-between items-center border-b-2 border-gray-800 pb-2 mb-4">
      <h1 class="text-lg sm:text-xl font-black tracking-wide text-gray-900">
        筑波大学MEIKEIオープンテニス PRACTICE SHEET (1〜5番)
      </h1>
      <div class="mt-2 md:mt-0 flex gap-2">
        <button onclick="debugReset()" class="px-2 py-1 text-[10px] bg-red-100 text-red-700 border border-red-300">データ初期化</button>
        <button onclick="toggleRole()" id="role-btn" class="px-3 py-1 text-xs bg-yellow-300 text-black border border-yellow-500 font-bold">TD管理者</button>
      </div>
    </div>

    <!-- コントロールバー -->
    <div class="flex flex-col sm:flex-row justify-between items-end mb-2 text-xs">
      <div class="flex flex-col space-y-1">
        <span class="font-bold text-gray-700">【1〜5番コート】 1枠20分（最大4名）</span>
        <div class="flex items-center space-x-2">
          <label for="date-select" class="font-bold">Date:</label>
          <input type="date" id="date-select" class="border border-gray-400 px-1 py-0.5">
        </div>
      </div>
      <div class="flex gap-3 mt-2 sm:mt-0 font-medium">
        <span class="text-green-700">■ 空き</span>
        <span class="text-blue-700">■ 自分の予約</span>
        <span class="text-gray-500">■ 予約済</span>
      </div>
    </div>

    <!-- タイムテーブル（横スクロール対応） -->
    <div class="overflow-x-auto border-2 border-gray-800">
      <table class="w-full text-center border-collapse sheet-table bg-white text-[10px] sm:text-xs">
        <thead>
          <tr class="bg-gray-200 font-bold text-gray-800 h-8">
            <th class="w-16 sm:w-24 bg-gray-300 border-r-2 border-gray-800 sticky-time border-b border-gray-500 shadow-[2px_0_4px_rgba(0,0,0,0.1)]">Starting</th>
            <th class="min-w-[65px] w-1/5">Court 1</th>
            <th class="min-w-[65px] w-1/5">Court 2</th>
            <th class="min-w-[65px] w-1/5">Court 3</th>
            <th class="min-w-[65px] w-1/5">Court 4</th>
            <th class="min-w-[65px] w-1/5">Court 5</th>
          </tr>
        </thead>
        <tbody id="timetable-body">
          <!-- JSで描画 -->
        </tbody>
      </table>
    </div>

    <!-- 自分の予約チケット -->
    <div class="mt-6 border border-gray-400 p-3 bg-gray-50">
      <h3 class="font-bold text-sm text-gray-800 border-b border-gray-300 pb-1 mb-2">
        ■ 自分の予約 / My Bookings
      </h3>
      <div id="my-bookings-list" class="space-y-2"></div>
    </div>

    <!-- TD用メニュー -->
    <div id="td-controls" class="hidden mt-4 pt-4 border-t border-gray-300 flex gap-2 flex-wrap">
      <button onclick="openPosterModal()" class="px-3 py-1 text-xs bg-gray-800 text-white border border-gray-900">QRポスター印刷</button>
      <button onclick="exportCSV()" class="px-3 py-1 text-xs bg-gray-100 text-gray-800 border border-gray-400">CSVエクスポート</button>
    </div>

  </main>

  <!-- 以下、モーダル群（共通） -->
  <div id="booking-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white max-w-sm w-full border-2 border-gray-800 p-4 shadow-xl">
      <h4 class="font-bold text-gray-800 mb-1 border-b-2 border-gray-800 pb-1">練習コート予約</h4>
      <p class="text-sm font-bold text-green-700 my-2" id="modal-slot-info"></p>
      <p class="text-[10px] text-gray-500 mb-3">※1コート最大4名。代表者と連絡先は必須です。</p>

      <div class="space-y-2 text-xs">
        <div>
          <label class="block font-bold mb-0.5">代表選手氏名 *</label>
          <input type="text" id="input-player-name" class="w-full border border-gray-400 px-2 py-1 bg-yellow-50 focus:bg-white outline-none">
        </div>
        <div>
          <label class="block font-bold mb-0.5">連絡先電話番号 *</label>
          <input type="tel" id="input-phone" class="w-full border border-gray-400 px-2 py-1 bg-yellow-50 focus:bg-white outline-none">
        </div>
        <div class="pt-2 border-t border-gray-300 mt-2">
          <label class="block font-bold mb-1">同伴者（最大3名）</label>
          <input type="text" id="input-p2" placeholder="2人目" class="w-full border border-gray-300 px-2 py-1 mb-1 outline-none">
          <input type="text" id="input-p3" placeholder="3人目" class="w-full border border-gray-300 px-2 py-1 mb-1 outline-none">
          <input type="text" id="input-p4" placeholder="4人目" class="w-full border border-gray-300 px-2 py-1 outline-none">
        </div>
      </div>
      <div class="mt-4 flex space-x-2">
        <button onclick="closeBookingModal()" class="w-1/2 py-1.5 border border-gray-400 bg-gray-200 font-bold text-xs">キャンセル</button>
        <button onclick="confirmBooking()" class="w-1/2 py-1.5 border border-green-800 bg-green-600 text-white font-bold text-xs">予約確定</button>
      </div>
    </div>
  </div>

  <div id="td-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white max-w-sm w-full border-2 border-gray-800 p-4 shadow-xl">
      <h4 class="font-bold text-gray-800 mb-1 border-b-2 border-gray-800 pb-1">TD管理者モード</h4>
      <p class="text-xs font-bold text-gray-700 my-2" id="td-modal-slot-info"></p>
      
      <div class="space-y-2 mt-4">
        <button onclick="tdSetOfficial()" class="w-full py-2 border border-yellow-600 bg-yellow-300 text-black font-bold text-xs">公式練習用にブロック</button>
        <button onclick="tdCancelSlot()" class="w-full py-2 border border-red-800 bg-red-600 text-white font-bold text-xs">この枠を空きに戻す（取消）</button>
        <button onclick="closeTdModal()" class="w-full py-1.5 bg-gray-200 border border-gray-400 font-bold text-xs mt-2">戻る</button>
      </div>
    </div>
  </div>

  <div id="poster-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white max-w-lg w-full border-2 border-gray-800 p-4 shadow-xl">
      <h4 class="font-bold text-gray-800 mb-2 border-b-2 border-gray-800 pb-1">QRポスター作成</h4>
      <div class="text-xs space-y-2 mb-4">
        <input type="text" id="poster-base-url" class="w-full border border-gray-400 px-2 py-1">
        <div class="flex flex-wrap gap-2">
          <button onclick="generatePoster('all')" class="border border-gray-400 px-3 py-1 bg-gray-100">総合</button>
          <button onclick="generatePoster('c1')" class="border border-gray-400 px-3 py-1 bg-gray-100">Court 1</button>
          <button onclick="generatePoster('c2')" class="border border-gray-400 px-3 py-1 bg-gray-100">Court 2</button>
          <button onclick="generatePoster('c3')" class="border border-gray-400 px-3 py-1 bg-gray-100">Court 3</button>
          <button onclick="generatePoster('c4')" class="border border-gray-400 px-3 py-1 bg-gray-100">Court 4</button>
          <button onclick="generatePoster('c5')" class="border border-gray-400 px-3 py-1 bg-gray-100">Court 5</button>
        </div>
      </div>
      <div id="poster-print-area" class="border border-black p-4 text-center bg-white">
        <h2 class="font-bold text-gray-900 tracking-wide text-sm">筑波大学MEIKEIオープンテニス</h2>
        <h3 id="poster-court-title" class="text-xl font-black mt-1 border-b-2 border-black inline-block pb-1">PRACTICE SHEET</h3>
        <div id="qrcode-container" class="my-4 flex justify-center min-h-[160px]"></div>
        <p class="text-sm font-bold">QRコードをスキャンして予約</p>
      </div>
      <div class="mt-4 flex space-x-2">
        <button onclick="closePosterModal()" class="w-1/2 border border-gray-400 py-1.5 bg-gray-200 text-xs font-bold">閉じる</button>
        <button onclick="window.print()" class="w-1/2 border border-gray-800 py-1.5 bg-gray-800 text-white text-xs font-bold">印刷</button>
      </div>
    </div>
  </div>

  <script>
    let currentRole = 'player';
    let selectedSlot = null;

    // 時間枠 (20分刻み)
    const timeSlots = [
      '09:00 - 09:20', '09:20 - 09:40', '09:40 - 10:00',
      '10:00 - 10:20', '10:20 - 10:40', '10:40 - 11:00',
      '11:00 - 11:20', '11:20 - 11:40', '11:40 - 12:00',
      '12:00 - 12:20', '12:20 - 12:40', '12:40 - 13:00',
      '13:00 - 13:20', '13:20 - 13:40', '13:40 - 14:00',
      '14:00 - 14:20', '14:20 - 14:40', '14:40 - 15:00',
      '15:00 - 15:20', '15:20 - 15:40', '15:40 - 16:00',
      '16:00 - 16:20', '16:20 - 16:40', '16:40 - 17:00'
    ];

    // コート1〜5
    const courts = ['c1', 'c2', 'c3', 'c4', 'c5'];
    const courtLabels = { 'c1': 'Court 1', 'c2': 'Court 2', 'c3': 'Court 3', 'c4': 'Court 4', 'c5': 'Court 5' };

    // 保存キーを変更して6・7番用データと混ざらないようにする
    let bookings = JSON.parse(localStorage.getItem('meikei_paper_bookings_1to5')) || {};
    let myBookedIds = JSON.parse(localStorage.getItem('meikei_paper_my_ids_1to5')) || [];

    function debugReset() {
      if (confirm('スマホ内の予約データをすべて初期化しますか？')) {
        localStorage.removeItem('meikei_paper_bookings_1to5');
        localStorage.removeItem('meikei_paper_my_ids_1to5');
        bookings = {};
        myBookedIds = [];
        renderTimetable();
        renderMyBookings();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('date-select').value = new Date().toISOString().split('T')[0];
      const pUrl = document.getElementById('poster-base-url');
      if(pUrl) pUrl.value = window.location.href.split('?')[0];

      renderTimetable();
      renderMyBookings();
    });

    function toggleRole() {
      currentRole = currentRole === 'player' ? 'td' : 'player';
      const roleBtn = document.getElementById('role-btn');
      const tdControls = document.getElementById('td-controls');
      if (currentRole === 'td') {
        roleBtn.innerText = '選手モードに戻る';
        roleBtn.className = 'px-3 py-1 text-xs bg-red-600 text-white border border-red-800 font-bold';
        tdControls.classList.remove('hidden');
      } else {
        roleBtn.innerText = 'TD管理者';
        roleBtn.className = 'px-3 py-1 text-xs bg-yellow-300 text-black border border-yellow-500 font-bold';
        tdControls.classList.add('hidden');
      }
    }

    function renderTimetable() {
      const tbody = document.getElementById('timetable-body');
      tbody.innerHTML = '';

      timeSlots.forEach(time => {
        const tr = document.createElement('tr');
        // 時間セル（Starting: スクロール固定用クラス `sticky-time`）
        let html = `<td class="h-12 bg-gray-100 font-bold border-r-2 border-gray-800 text-gray-700 sticky-time">${time}</td>`;

        courts.forEach(court => {
          const key = `${time}_${court}`;
          const b = bookings[key];
          
          if (!b) {
            html += `<td onclick="handleSlotClick('${key}')" class="cursor-pointer hover:bg-green-50 text-gray-300 hover:text-green-600 transition p-1">
              <span class="text-[9px] sm:text-[10px] font-semibold">( 空き )</span>
            </td>`;
          } else if (b.status === 'official') {
            html += `<td onclick="handleSlotClick('${key}')" class="cursor-pointer bg-yellow-100 text-yellow-900 font-bold p-1">
              <div class="text-[10px] sm:text-xs truncate">${b.name}</div>
            </td>`;
          } else {
            const isMy = myBookedIds.includes(b.id);
            const others = [b.p2, b.p3, b.p4, b.partner].filter(Boolean);
            const othersText = others.length > 0 ? `+${others.length}名` : '';
            
            html += `<td onclick="handleSlotClick('${key}')" class="cursor-pointer p-1 ${isMy ? 'bg-blue-50 text-blue-900' : 'bg-white text-gray-800'}">
              <div class="flex flex-col justify-center h-full text-center">
                <span class="font-bold text-[10px] sm:text-xs truncate block max-w-full">${b.name}</span>
                ${othersText ? `<span class="text-[8px] sm:text-[9px] text-gray-500">${othersText}</span>` : ''}
              </div>
            </td>`;
          }
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    function handleSlotClick(key) {
      selectedSlot = key;
      const b = bookings[key];
      const [time, court] = key.split('_');

      if (currentRole === 'td') {
        const info = b ? `【予約】 ${b.name}\n同伴: ${[b.p2, b.p3, b.p4].filter(Boolean).join(',')||'なし'}` : '【空き枠】';
        document.getElementById('td-modal-slot-info').innerText = `${courtLabels[court]} (${time})\n${info}`;
        document.getElementById('td-modal').classList.remove('hidden');
        return;
      }

      if (!b) {
        if (myBookedIds.length >= 1) {
          alert('1選手1日1枠までです。予約を変更する場合は下のチケットから取り消してください。');
          return;
        }
        document.getElementById('modal-slot-info').innerText = `${courtLabels[court]} | ${time}`;
        document.getElementById('booking-modal').classList.remove('hidden');
      } else if (myBookedIds.includes(b.id)) {
        if (confirm(`この予約を取り消しますか？`)) {
          cancelBookingLocal(key, b.id);
        }
      } else {
        alert('この枠はすでに予約されています。');
      }
    }

    function closeBookingModal() { document.getElementById('booking-modal').classList.add('hidden'); }
    function closeTdModal() { document.getElementById('td-modal').classList.add('hidden'); }

    function confirmBooking() {
      const name = document.getElementById('input-player-name').value.trim();
      const phone = document.getElementById('input-phone').value.trim();
      if (!name || !phone) return alert('代表者名と電話番号を入力してください。');

      const bId = 'MK-' + Math.floor(100 + Math.random() * 900);
      myBookedIds.push(bId);
      localStorage.setItem('meikei_paper_my_ids_1to5', JSON.stringify(myBookedIds));

      bookings[selectedSlot] = {
        name, phone, status: 'booked', id: bId,
        p2: document.getElementById('input-p2').value.trim(),
        p3: document.getElementById('input-p3').value.trim(),
        p4: document.getElementById('input-p4').value.trim()
      };
      localStorage.setItem('meikei_paper_bookings_1to5', JSON.stringify(bookings));

      closeBookingModal();
      document.getElementById('input-player-name').value = '';
      document.getElementById('input-phone').value = '';
      document.getElementById('input-p2').value = '';
      document.getElementById('input-p3').value = '';
      document.getElementById('input-p4').value = '';

      renderTimetable();
      renderMyBookings();
    }

    function cancelBookingLocal(key, bId) {
      myBookedIds = myBookedIds.filter(id => id !== bId);
      localStorage.setItem('meikei_paper_my_ids_1to5', JSON.stringify(myBookedIds));
      delete bookings[key];
      localStorage.setItem('meikei_paper_bookings_1to5', JSON.stringify(bookings));
      renderTimetable();
      renderMyBookings();
    }

    function tdSetOfficial() {
      if (!selectedSlot) return;
      closeTdModal();
      bookings[selectedSlot] = { name: '公式割当', status: 'official', id: 'MK-OFFICIAL' };
      localStorage.setItem('meikei_paper_bookings_1to5', JSON.stringify(bookings));
      renderTimetable();
    }

    function tdCancelSlot() {
      if (!selectedSlot) return;
      closeTdModal();
      delete bookings[selectedSlot];
      localStorage.setItem('meikei_paper_bookings_1to5', JSON.stringify(bookings));
      renderTimetable();
      renderMyBookings();
    }

    function renderMyBookings() {
      const list = document.getElementById('my-bookings-list');
      list.innerHTML = '';
      let count = 0;
      const validIds = [];

      for (let key in bookings) {
        const b = bookings[key];
        if (b && myBookedIds.includes(b.id)) {
          count++;
          validIds.push(b.id);
          const [time, court] = key.split('_');
          const others = [b.p2, b.p3, b.p4].filter(Boolean).join(',');
          
          list.innerHTML += `
            <div class="flex justify-between items-center text-xs border border-gray-400 p-2 bg-white">
              <div>
                <span class="font-bold text-gray-800">${courtLabels[court]} | ${time}</span><br>
                <span>代表: ${b.name} ${others ? `(他: ${others})` : ''}</span>
              </div>
              <button onclick="handleSlotClick('${key}')" class="px-2 py-1 bg-gray-200 border border-gray-400 font-bold text-gray-600">取消</button>
            </div>
          `;
        }
      }

      if (validIds.length !== myBookedIds.length) {
        myBookedIds = validIds;
        localStorage.setItem('meikei_paper_my_ids_1to5', JSON.stringify(myBookedIds));
      }
      if (count === 0) list.innerHTML = `<p class="text-xs text-gray-500">現在予約はありません。</p>`;
    }

    function openPosterModal() {
      document.getElementById('poster-modal').classList.remove('hidden');
      generatePoster('all');
    }
    function closePosterModal() { document.getElementById('poster-modal').classList.add('hidden'); }

    function generatePoster(target) {
      const baseUrl = document.getElementById('poster-base-url').value.trim();
      const qc = document.getElementById('qrcode-container');
      qc.innerHTML = '';
      let tUrl = baseUrl;
      if (target.startsWith('c')) {
        tUrl += `?court=${target}`;
        document.getElementById('poster-court-title').innerText = `Court ${target.replace('c','')} 予約`;
      } else {
        document.getElementById('poster-court-title').innerText = 'PRACTICE SHEET (1〜5)';
      }

      new QRCode(qc, { text: tUrl, width: 140, height: 140, colorDark: "#000", colorLight: "#fff" });
    }
  </script>
</body>
</html>
